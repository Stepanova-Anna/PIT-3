version: '3.8'

services:
  ping-pong-1:
    build: .
    container_name: ping-pong-1
    ports:
      - "5001:5000"
    environment:
      - APP_PORT=5000
      - PONG_MESSAGE=pong-from-instance-1
    restart: unless-stopped

  ping-pong-2:
    build: .
    container_name: ping-pong-2
    ports:
      - "5002:5000"
    environment:
      - APP_PORT=5000
      - PONG_MESSAGE=pong-from-instance-2
    restart: unless-stopped
